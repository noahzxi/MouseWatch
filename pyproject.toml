[project]
name = "pointerprint"
version = "0.1.0"
description = "Continuous authentication from pointer movement patterns."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pointerprint-train = "pointerprint.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "desktop", "shared", "model"]
testpaths = ["tests", "desktop/tests"]
